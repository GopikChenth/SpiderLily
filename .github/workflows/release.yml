name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name (e.g. 9.8.1). If omitted, reads from build.gradle'
        required: false
        default: ''
      draft:
        description: 'Create as draft release'
        type: boolean
        required: false
        default: false
      prerelease:
        description: 'Create as pre-release'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  prepare_version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.version_code }}
      tag_name: ${{ steps.version.outputs.tag_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine version and version code
        id: version
        run: |
          INPUT_VER="${{ inputs.version }}"
          if [ -n "$INPUT_VER" ]; then
            VERSION="${INPUT_VER#v}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG=${GITHUB_REF#refs/tags/}
            VERSION=${TAG#v}
          else
            FILE=app/build.gradle
            VERSION=$(grep -oP "versionName project.hasProperty\('versionName'\) \? project.property\('versionName'\) : '\K[^']+" "$FILE" | head -n1 || true)
            if [ -z "$VERSION" ]; then
              VERSION=$(grep -oP 'android:versionName="\K[^"]+' app/src/main/AndroidManifest.xml | head -n1)
            fi
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          PATCH=${PATCH:-0}
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))

          echo "Detected version: $VERSION ($VERSION_CODE)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag_name=v$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare_version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        uses: android-actions/setup-android@v3

      - name: Check Keystore Configuration
        id: keystore_check
        run: |
          if [ -n "${{ secrets.KEYSTORE_FILE }}" ] && [ -n "${{ secrets.KEYSTORE_PASSWORD }}" ]; then
            echo "${{ secrets.KEYSTORE_FILE }}" | base64 -d > keystore.jks
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
            echo "Keystore decoded successfully."
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
            echo "No KEYSTORE_FILE / KEYSTORE_PASSWORD secrets provided."
          fi

      - name: Build Release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          ./gradlew assembleRelease \
            -PversionName=${{ needs.prepare_version.outputs.version }} \
            -PversionCode=${{ needs.prepare_version.outputs.version_code }} \
            --no-build-cache --no-configuration-cache
          
          mkdir -p release-output
          cp app/build/outputs/apk/release/app-release.apk "release-output/SpiderLily-${{ needs.prepare_version.outputs.version }}.apk"

      - name: Prepare Changelog
        id: release_notes
        run: |
          CHANGELOG_FILE="metadata/en-US/changelogs/${{ needs.prepare_version.outputs.version_code }}.txt"
          if [ -f "$CHANGELOG_FILE" ]; then
            echo "Found changelog file: $CHANGELOG_FILE"
            BODY=$(cat "$CHANGELOG_FILE")
          else
            BODY="SpiderLily ${{ needs.prepare_version.outputs.version }} release."
          fi
          {
            echo "body<<EOF"
            echo "$BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare_version.outputs.tag_name }}
          name: SpiderLily ${{ needs.prepare_version.outputs.version }}
          body: ${{ steps.release_notes.outputs.body }}
          draft: ${{ inputs.draft == true }}
          prerelease: ${{ inputs.prerelease == true }}
          generate_release_notes: true
          files: release-output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up keystore
        if: always()
        run: rm -f keystore.jks
